name: Electron builds & release

# Build three desktop targets on every push to main and publish a release.
# The tag and name come from package.json; the banner comes from banner.png.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder writes installers to release/ (see build.directories.output).
      - name: Install dependencies
        run: npm ci

      - name: Build renderer (tsc + vite)
        run: npm run build

      - name: Package Electron app (${{ matrix.target }})
        env:
          # No signing certificate on CI, so macOS dmg/zip are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NyaMath-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Version and app name are the single source of truth: package.json.
      - name: Read package.json metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")
          APP_NAME=$(node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(p.desktopName || p.build?.productName || p.name)")
          test -n "$VERSION" && test -n "$APP_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "banner=https://raw.githubusercontent.com/${{ github.repository }}/v$VERSION/banner.png" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -lh release

      # Same package.json version means the release already exists: assets change,
      # while legacy Russian notes are translated once.
      - name: Check release state
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          if BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if printf '%s' "$BODY" | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => process.exit(/[\u0400-\u052F]/.test(s) ? 0 : 1))"; then
              echo "fix_body=true" >> "$GITHUB_OUTPUT"
            else
              echo "fix_body=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "fix_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.release_state.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.app_name }} ${{ steps.meta.outputs.version }}
          body: |
            ![${{ steps.meta.outputs.app_name }}](${{ steps.meta.outputs.banner }})

            **${{ steps.meta.outputs.app_name }} ${{ steps.meta.outputs.version }}**

            Builds: Windows (NSIS), Linux (AppImage, deb), macOS (dmg, zip).
            Tag and name are generated from `package.json` (commit `${{ github.sha }}`).
          generate_release_notes: true
          files: release/*
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Translate legacy release notes
        if: steps.release_state.outputs.exists == 'true' && steps.release_state.outputs.fix_body == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          body: |
            ![${{ steps.meta.outputs.app_name }}](${{ steps.meta.outputs.banner }})

            **${{ steps.meta.outputs.app_name }} ${{ steps.meta.outputs.version }}**

            Builds: Windows (NSIS), Linux (AppImage, deb), macOS (dmg, zip).
            Tag and name are generated from `package.json` (commit `${{ github.sha }}`).
          generate_release_notes: true

      # No name/body here: the action keeps the existing release metadata.
      - name: Replace assets in existing release
        if: steps.release_state.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          files: release/*
          overwrite_files: true
          fail_on_unmatched_files: true
